name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        node: [22.18, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm registry:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
  consumer:
    strategy:
      fail-fast: false
      matrix:
        node: [22.18, 24]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # shadcn-vue's nypm otherwise sends native pnpm 12 through Corepack's JS launcher.
      - name: Use the native pnpm installed by action-setup
        run: npm uninstall --global corepack
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mdxcn-vue --filter mdxcn-markdown build
      - run: pnpm consumer:check
